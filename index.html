<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>じしんカンペ</title>

<style>
:root{
    --gimmick-size:18px;
    --action-size:24px;
    --button-size:15px;
    --row-padding:6px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:6px;
    background:#111;
    color:#fff;
    font-family:sans-serif;
}

.btns{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:4px;
    margin-bottom:6px;
}

button{
    padding:8px 4px;
    border:none;
    border-radius:4px;
    background:#333;
    color:#fff;
    cursor:pointer;
    font-size:var(--button-size);
}

button.active{
    background:#00aaff;
    color:#000;
    font-weight:bold;
}

.sizeBtns{
    display:flex;
    justify-content:center;
    gap:4px;
    margin-bottom:8px;
}

.row{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:10px;
    align-items:center;
    padding:var(--row-padding) 0;
    border-bottom:1px solid #222;
}

.gimmick{
    font-size:var(--gimmick-size);
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.action{
    font-size:var(--action-size);
    font-weight:bold;
    line-height:1.15;
    display:inline-block;
    width:fit-content;
    padding:4px 10px;
    border-radius:6px;
}

/* 線取り */
.line{
    background:#ffd700;
    color:#000;
}
/* ビーム */
.beam{
    background:#ffd700;
    color:#000;
}

/* 交代 */
.swap{
    background:#ff3030;
    color:#fff;
}

/* 頭割り */
.stack{
    background:#00aaff;
    color:#fff;
}

/* 待機 */
.wait{
    color:#888;
    background:none;
    padding:0;
}

/* なし */
.none{
    color:#555;
    background:none;
    padding:0;
}

/* スマホ */
@media (max-width:700px){

    .row{
        grid-template-columns:110px 1fr;
        gap:6px;
    }

    .gimmick{
        font-size:12px;
    }

    .action{
        font-size:15px;
        padding:2px 6px;
    }

    button{
        font-size:11px;
        padding:6px 2px;
    }
}
</style>
</head>

<body>

<div class="btns">
    <button onclick="showCol(1)">アタック1</button>
    <button onclick="showCol(2)">アタック2</button>
    <button onclick="showCol(3)">アタック3</button>
    <button onclick="showCol(4)">バインド1</button>
    <button onclick="showCol(5)">バインド2</button>
    <button onclick="showCol(6)">バインド3</button>
    <button onclick="showCol(7)">禁止1</button>
    <button onclick="showCol(8)">禁止2</button>
</div>

<div class="sizeBtns">
    <button onclick="setSize('small')">小</button>
    <button onclick="setSize('medium')">中</button>
    <button onclick="setSize('large')">大</button>
</div>

<div id="list"></div>

<script>

const data = [

["びんた①（半面避け）","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開"],

["ブラックホール①","1本目の線取り","中央待機","中央待機","中央待機","中央待機","中央待機","中央待機","中央待機"],

["ブラックホール①","2本目の線取り","1本目の線取り","中央待機","中央待機","中央待機","中央待機","中央待機","中央待機"],

["サンダガ","-","-","-","-","-","-","-","-"],

["ダミング＋びんた","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開"],

["ブラックホール②","3本目の線取り","2本目の線取り","1本目の線取り","中央待機","中央待機","中央待機","中央待機","中央待機"],

["ブラックホール②","バインド1と交代","3本目のビーム","2本目のビーム","1本目の線取り（アタック1と交代）","中央待機","中央待機","中央待機","中央待機"],

["ブラックホール②","中央待機","バインド2と交代","3本目のビーム","2本目のビーム","1本目の線取り（アタック2と交代）","中央待機","中央待機","中央待機"],

["ダミング＋ぼくちん","-","-","-","-","-","-","-","-"],

["サンダガ","-","-","-","-","-","-","-","-"],

["ブラックホール③","中央待機","中央待機","中央待機","3本目の線取り","2本目の線取り","1本目の線取り","中央待機","中央待機"],

["ブラックホール③","中央待機","中央待機","中央待機","禁止1と交代","3本目のビーム","2本目のビーム","1本目の線取り（バインド1と交代）","中央待機"],

["ブラックホール③","中央待機","中央待機","中央待機","中央待機","禁止2と交代","3本目のビーム","2本目のビーム","1本目の線取り（バインド2と交代）"],

["WH＋ヴァーティカル/ホリゾンタル＋びんた","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開","頭割り/ロール散開"],

["ブラックホール④","中央待機","中央待機","中央待機","中央待機","中央待機","中央待機","3本目の線取り","2本目の線取り"],

["ブラックホール④","中央待機","中央待機","中央待機","中央待機","中央待機","中央待機","中央待機","3本目の線取り"],

["ぼくちん","-","-","-","-","-","-","-","-"]

];

function shortName(name){
    return name
        .replace("ブラックホール","BH")
        .replace("ヴァーティカル/ホリゾンタル","VH");
}

function showCol(col){

    const list=document.getElementById("list");
    list.innerHTML="";

    data.forEach(row=>{

        const gimmick=shortName(row[0]);
        const action=row[col];

        let cls="action";

        if(action.includes("線取り")){
            cls+=" line";
            
        }
else if(action.includes("ビーム")){
    cls+=" beam";
}
        
        else if(action.includes("交代")){
            cls+=" swap";
        }
        else if(action.includes("頭割り")){
            cls+=" stack";
        }
        else if(action.includes("中央待機")){
            cls+=" wait";
        }
        else if(action==="-" ){
            cls+=" none";
        }

        list.innerHTML += `
        <div class="row">
            <div class="gimmick">${gimmick}</div>
            <div class="${cls}">${action}</div>
        </div>`;
    });

    document.querySelectorAll(".btns button").forEach((b,i)=>{
        b.classList.toggle("active",i===col-1);
    });
}

function setSize(size){

    const root=document.documentElement;

    switch(size){

        case "small":
            root.style.setProperty("--gimmick-size","12px");
            root.style.setProperty("--action-size","15px");
            root.style.setProperty("--button-size","11px");
            root.style.setProperty("--row-padding","2px");
            break;

        case "medium":
            root.style.setProperty("--gimmick-size","16px");
            root.style.setProperty("--action-size","20px");
            root.style.setProperty("--button-size","13px");
            root.style.setProperty("--row-padding","4px");
            break;

        case "large":
            root.style.setProperty("--gimmick-size","20px");
            root.style.setProperty("--action-size","28px");
            root.style.setProperty("--button-size","16px");
            root.style.setProperty("--row-padding","8px");
            break;
    }

    localStorage.setItem("fontSizeMode",size);
}

window.addEventListener("load",()=>{

    setSize(
        localStorage.getItem("fontSizeMode")
        || (window.innerWidth < 700 ? "small" : "large")
    );

    showCol(1);

});
</script>

</body>
</html>
